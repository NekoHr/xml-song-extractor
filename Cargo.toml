[package]
name = "xml_song_extractor"
version = "1.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.13", default-features = false, features = ["tiny-skia"] }
rfd = "0.15"            # Native File & Folder Dialogs 
quick-xml = "0.37"      # Fast XML Parser
encoding_rs = "0.8"     # Robust UTF-8 / UTF-16 decoding
dark-light = "1.0"      # Queries the system settings to determine Dark or Light mode

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"     # Optimize binary for small size
lto = true          # Enable Link-Time Optimization across all crates
codegen-units = 1   # Maximize optimization visibility across code units
panic = "abort"     # Remove unwinding landing pads (shrinks code size)
strip = true        # Strip debug symbols automatically from the binary